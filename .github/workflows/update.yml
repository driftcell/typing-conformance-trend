name: Update trend chart

on:
  schedule:
    # Every Monday at 00:00 UTC
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Restore downloaded results cache
        uses: actions/cache@v4
        with:
          path: data
          key: typing-results-${{ github.run_id }}
          restore-keys: typing-results-

      - name: Rebuild data and chart
        run: uv run typing-conformance-trend

      - name: Commit and push if changed
        run: |
          if [[ -z "$(git status --porcelain index.html trend.csv)" ]]; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html trend.csv
          git commit -m "Update typing conformance trend ($(date -u +%F))"
          git push
